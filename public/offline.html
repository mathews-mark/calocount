<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CalTrack — Offline</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f8f7f2; color: #1c1917;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
  }
  .card {
    max-width: 380px; width: 100%; text-align: center;
    background: #fff; border: 1px solid #e7e4dc; border-radius: 16px;
    padding: 40px 28px; box-shadow: 0 1px 3px rgba(20,50,30,.05);
  }
  .logo { width: 56px; height: 56px; margin: 0 auto 20px; display: block; }
  h1 { margin: 0 0 8px; font-size: 20px; letter-spacing: -.02em; color: #14532d; }
  p { margin: 0 0 24px; font-size: 14.5px; line-height: 1.6; color: #78716c; }
  button {
    font: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
    background: #16a34a; color: #fff; border: 0;
    border-radius: 10px; padding: 11px 22px;
  }
  button:active { background: #128c3f; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icon-192.png" alt="" class="logo">
    <h1>You're offline</h1>
    <p>CalTrack needs a connection to reach your spreadsheet. Your logged entries are safe — reconnect and everything will be here.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
